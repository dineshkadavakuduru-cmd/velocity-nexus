name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check assets
        run: npm run assets:check

      - name: Smoke test
        run: npm run test:smoke

      - name: Build
        run: npm run build

# Deploy to production is handled by the Vercel Git integration (automatic on
# push to main). Required Vercel env var: NEXT_PUBLIC_SOCKET_URL pointing at
# the separately deployed Socket.IO server (see README "Production deploy").
# Do NOT re-add a vercel-action deploy step here — it causes double deploys.
